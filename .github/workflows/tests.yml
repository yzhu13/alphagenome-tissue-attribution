name: tests

on:
  push:
  pull_request:

jobs:
  tool:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tissue_attribution
        run: pip install "./tool[test]"
      - name: Run tests
        run: python -m pytest tool/tests -q
